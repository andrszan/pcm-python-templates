id: fastapi-sqlalchemy-postgresql-api
name: FastAPI + SQLAlchemy + PostgreSQL API 项目起点
description: 面向独立 PostgreSQL API 服务起步的业务无关同步 FastAPI 项目起点。
tags:
  - api
  - python
  - fastapi
  - sqlalchemy
  - alembic
  - postgresql
commands:
  install: uv sync --locked
  dev: uv run --locked uvicorn app.main:app --reload
  check: uv run --locked ruff check . && uv run --locked ruff format --check .
  test: uv run --locked pytest
  build: uv build
